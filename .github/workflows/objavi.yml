# Objava web aplikacije RINNO Cartesian (23.10.2026).
# RPI5 salje podatke SVAKU MINUTU; obicna GitHub Pages objava smije samo ~10 puta na sat,
# ovako (GitHub Actions) moze svaki put. Starija objava koja jos traje se prekine - vazi zadnja.
name: Objavi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: objava
        uses: actions/deploy-pages@v4
